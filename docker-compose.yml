services:
  catalogo-db:
    image: mongo:7
    container_name: catalogo-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - catalogo-db-data:/data/db
    networks:
      - catalogo-net
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN, SETUID, SETGID]
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  catalogo-api:
    build: 
      context: backend
      dockerfile: ./v2.dockerfile
    container_name: catalogo-api
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_VERSION=${APP_VERSION}
      - ROOT_PATH=${ROOT_PATH}
      - SEED_DEMO=${SEED_DEMO}
    ports:
      - "8000:8000"
    networks:
      - catalogo-net
    cap_drop: [ALL]
    depends_on:
      catalogo-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; \
          urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  catalogo-frontend:
    build: ./frontend
    container_name: catalogo-frontend
    environment:
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
    ports:
      - "3000:8080"
    networks:
      - catalogo-net
    cap_drop: [ALL]
    depends_on:
      - catalogo-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    
volumes:
  catalogo-db-data:
    name: catalogo-db-data
networks:
  catalogo-net:
    name: catalogo-net